site_name: Docker
site_url: https://docker.rafaeldutra.me
site_author: Rafael Dutra
site_description: >-
  Olá! Me chamo Rafael Dutra e aqui encontrará documentação e dicas para Docker.
copyright: Copyright &copy; 2016 - 2026 Rafael Dutra
edit_uri: ''

repo_url: https://github.com/raffaeldutra/docker.raffaeldutra.github.io
repo_name: docker.raffaeldutra.github.io
extra:
  analytics:
    provider: google
    property: G-QJH8ZT9QS2
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/raffaeldutra
    - icon: fontawesome/brands/gitlab
      link: https://gitlab.com/raffaeldutra
    - icon: fontawesome/brands/docker
      link: https://hub.docker.com/raffaeldutra
    - icon: fontawesome/brands/linkedin
      link: https://linkedin.com/in/rafaeldutra

# Internacionalização. O conteúdo padrão (sem sufixo) é português; os arquivos
# `*.en.md` são a versão em inglês. O seletor de idioma aparece no cabeçalho.
plugins:
  - search
  - i18n:
      docs_structure: suffix
      fallback_to_default: true
      reconfigure_material: true
      reconfigure_search: true
      languages:
        - locale: pt
          name: Português
          default: true
          build: true
          site_name: Docker
          site_description: >-
            Olá! Me chamo Rafael Dutra e aqui encontrará documentação e dicas para Docker.
        - locale: en
          name: English
          build: true
          site_name: Docker
          site_description: >-
            Hi! My name is Rafael Dutra and here you will find documentation and tips for Docker.
          nav_translations:
            Instalando: Installing
            Rodando Containers: Running Containers
            Gerenciando Containers: Managing Containers
            Manipulando Containers: Manipulating Containers
            Interagindo com Containers: Interacting with Containers
            Limpando: Cleaning Up
            Imagens: Images
            Criando Imagens: Building Images
            Criando Imagens sem Dockerfile: Building Images without a Dockerfile
            BuildKit e buildx: BuildKit and buildx
            Introdução: Introduction
            Redes: Networking
            Redes no Docker: Docker Networking
            Rede bridge: Bridge network
            host, none, macvlan e overlay: host, none, macvlan and overlay
            Registries e Distribuição: Registries and Distribution
            Registries e Docker Hub: Registries and Docker Hub
            Distribuindo imagens: Distributing images
            Segurança: Security
            Segurança de containers: Container security
            Boas práticas de imagens: Image best practices

nav:
  - Docker: index.md
  - Instalando: installing.md

  - Containers:
    - Rodando Containers: c1/running-containers.md
    - Gerenciando Containers: c1/managing-containers.md
    - Manipulando Containers: c1/manipulate-containers.md
    - Interagindo com Containers: c1/interacting-containers.md
    - Limpando: c1/cleaning.md

  - Imagens:
    - Dockerfile: c2/dockerfile.md
    - Criando Imagens: c2/creating-image.md
    - Criando Imagens sem Dockerfile: c2/creating-image-no-dockerfile.md
    - Multi-stage builds: c2/multi-stage.md
    - BuildKit e buildx: c2/buildkit.md

  - Volumes:
    - Introdução: c3/volumes.md
    - Storage Drivers: c3/storage-drivers.md

  - Redes:
    - Redes no Docker: c4/networking.md
    - Rede bridge: c4/bridge.md
    - host, none, macvlan e overlay: c4/advanced-networks.md

  - Registries e Distribuição:
    - Registries e Docker Hub: c5/registry.md
    - Distribuindo imagens: c5/distribuindo-imagens.md

  - Segurança:
    - Segurança de containers: c6/seguranca.md
    - Boas práticas de imagens: c6/boas-praticas.md

  - Docker Compose:
    - docker-compose.md

theme:
  name: material
  custom_dir: overrides
  features:
    - search.suggest
    - search.highlight
    - navigation.indexes
    - navigation.footer
    - navigation.sections
    - navigation.expand
    - content.tabs.link
    - content.tooltips
    - content.code.annotate
    - content.code.copy
    - content.code.select
  language: pt-BR

  palette:
  - media: "(prefers-color-scheme)"
    toggle:
      icon: material/brightness-auto
      name: Seguir preferência do sistema
  - media: "(prefers-color-scheme: light)"
    scheme: default
    primary: teal
    accent: purple
    toggle:
      icon: material/brightness-7
      name: Mudar para o modo escuro
  - media: "(prefers-color-scheme: dark)"
    scheme: slate
    primary: teal
    accent: lime
    toggle:
      icon: material/brightness-4
      name: Mudar para o modo claro
  font:
    text: Roboto
    code: Roboto Mono

markdown_extensions:
  - admonition
  - def_list
  - pymdownx.tasklist:
      custom_checkbox: true
